# Default: remote DGX vLLM (see clients below); fall back to local ollama for offline work.
model: vllm:qwen3.8-flash-next
keybindings: vi
function_calling: true
rag_embedding_model: ollama:embeddinggemma:latest
# vllm connection supplied via VLLM_API_BASE and VLLM_API_KEY in .env.llm.
clients:
- type: openai-compatible
  name: vllm
  patch:
    chat_completions:
      '.*':
        body:
          temperature: 0.3
          chat_template_kwargs:
            enable_thinking: false
  models:
  - name: qwen3.8-flash-next
    max_input_tokens: 262144
    supports_vision: true
    supports_function_calling: true
    supports_reasoning: true

- type: openai-compatible
  name: ollama
  api_base: http://127.0.0.1:11434/v1
  models:
  - name: gemma4:e2b
    max_input_tokens: 128000
    supports_vision: true
    supports_function_calling: true
    supports_reasoning: true

  - name: gemma4:e4b
    max_input_tokens: 128000
    supports_vision: true
    supports_function_calling: true
    supports_reasoning: true

  - name: qwen3.8:27b
    max_input_tokens: 256000
    supports_vision: true
    supports_function_calling: true
    supports_reasoning: true

  - name: hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ2_XXS
    max_input_tokens: 256000
    supports_vision: true
    supports_function_calling: true

  - name: openbmb/minicpm-v4.7:35b-a3b
    max_input_tokens: 262144
    supports_vision: true
    supports_function_calling: true
    supports_reasoning: true

  - name: embeddinggemma:latest
    type: embedding
    max_tokens_per_chunk: 512

  - name: qwen3-embedding:8b
    type: embedding
    max_tokens_per_chunk: 2048
